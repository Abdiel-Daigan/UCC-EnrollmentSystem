<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unida Christian Colleges</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">
        <div class="brand">
            <div class="logo">
                UCC
            </div>

            <div class="brand-name">
                <div>UNIDA</div>
                <div>CHRISTIAN COLLEGES</div>
            </div>
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#programs">Programs</a>
            <a href="#admissions">Admissions</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>


    <!-- MAIN CONTENT -->
    <main id="home" class="main">

        <!-- LEFT SIDE -->
        <section class="hero">

            <div class="hero-image"></div>
            <div class="hero-overlay"></div>

            <div class="hero-content">
                <h1>Unida Christian Colleges</h1>

                <p>
                    At UCC, we shape excellence, integrity,<br>
                    and purpose for life
                </p>

                <button class="enroll-btn" onclick="enrollNow()">
                    ENROLL NOW!
                </button>
            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="login-section">

            <div class="login-card">

                <div class="google-logo">
                    G
                </div>

                <h2>Sign in with Google</h2>

                <p class="subtitle">
                    Use your Gmail account
                </p>

                <button class="google-btn" onclick="googleLogin()">

                    <span class="google-button-logo">
                        G
                    </span>

                    <span>
                        Sign in with Google
                    </span>

                </button>


                <div class="divider">
                    <span></span>
                    <strong>OR</strong>
                    <span></span>
                </div>


                <p class="notice">
                    Make sure you are using your personal<br>
                    Gmail account.
                </p>

            </div>


            <!-- BOTTOM TEXT -->
            <div class="tagline">
                <div>DREAM HIGH, AIM HIGH</div>
                <strong>AMBASSADORS!</strong>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
